[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biomaker"
version = "0.0.3"
authors = [
    {name = "Haoyu Wang", email = "haoyu.wang.8023@gmail.com"},
]
description = "Agentic AutoML for Biomedical Image Analysis"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["dependencies"]

[project.urls]
"Homepage" = "https://github.com/uni-medical/BioMaker"

[project.scripts]
biomaker = "biomaker.run:run"

[tool.setuptools]
package-data = {biomaker = ["utils/config.yaml", "utils/viz_templates/*"]}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.uv]
# Dependency metadata changes when this file changes, even if pyproject.toml
# itself has not changed since the previous checkout.
cache-keys = [{ file = "pyproject.toml" }, { file = "requirements.txt" }]

[tool.setuptools.packages.find]
include = ["biomaker*"]
exclude = ["logs*", "workspaces*", "exp_summary*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
