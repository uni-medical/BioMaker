[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crea-med"
version = "0.0.3"
authors = [
    {name = "Haoyu Wang", email = "haoyu.wang.8023@gmail.com"},
]
description = "Agentic Medical Deep Learning Engineer"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["dependencies"]

[project.urls]
"Homepage" = "https://github.com/uni-medical/MedDLE"

[project.scripts]
meddle = "meddle.run:run"

[tool.setuptools]
package-data = {meddle = ["../requirements.txt", "utils/config.yaml", "utils/viz_templates/*"]}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["meddle*"]
exclude = ["logs*", "workspaces*", "exp_summary*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
