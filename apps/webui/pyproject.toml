[project]
name = "biomaker-webui"
version = "0.1.0"
description = "Local sidecar web interface for BioMaker"
requires-python = ">=3.11,<3.13"
dependencies = [
    "biomaker",
    "fastapi>=0.115,<1",
    "psutil>=6,<8",
    "python-dotenv>=1.0,<2",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=9.1.1,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The workspace may set TMPDIR to a Windows mount under WSL; pytest's fd capture
# cannot reliably truncate its temporary file there.
addopts = "-q -s"
pythonpath = [".", "../.."]

[tool.uv]
package = false

[tool.uv.sources]
biomaker = {path = "../..", editable = true}
