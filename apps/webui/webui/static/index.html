<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>BioMaker</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script defer src="/static/app.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="brand-block">
        <div class="brand-mark" aria-hidden="true">B</div>
        <strong>BioMaker</strong>
      </div>
      <div class="header-context">
        <span id="queue-indicator" class="queue-indicator" hidden></span>
      </div>
      <div class="header-actions">
        <button id="refresh-button" class="icon-button" type="button" title="Refresh" aria-label="Refresh">
          <span class="icon-fallback" aria-hidden="true">↻</span>
          <i data-lucide="refresh-cw" aria-hidden="true"></i>
        </button>
        <button id="settings-button" class="icon-button" type="button" title="Settings" aria-label="Settings">
          <span class="icon-fallback" aria-hidden="true">⚙</span>
          <i data-lucide="settings" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <main class="workbench">
      <aside class="sidebar" aria-label="Tasks">
        <section class="sidebar-section projects-section">
          <div class="section-heading">
            <h2>Tasks</h2>
            <button id="new-project-button" class="new-project-action" type="button" title="New task" aria-label="New task">
              <span class="icon-fallback" aria-hidden="true">+</span>
              <i data-lucide="plus" aria-hidden="true"></i>
              <span>New</span>
            </button>
          </div>
          <div id="project-list" class="nav-list" role="list"></div>
        </section>

      </aside>

      <section class="editor-pane" aria-label="Task editor">
        <div class="pane-heading editor-heading">
          <h1 id="editor-title">New task</h1>
          <div class="editor-actions">
            <button id="delete-project-button" class="icon-button danger-ghost" type="button" title="Delete task" aria-label="Delete task" hidden>
              <span class="icon-fallback" aria-hidden="true">×</span>
              <i data-lucide="trash-2" aria-hidden="true"></i>
            </button>
            <button id="save-project-button" class="button secondary" type="button">
              <i data-lucide="save" aria-hidden="true"></i>
              Save
            </button>
          </div>
        </div>

        <form id="project-form" class="project-form" autocomplete="off">
          <input id="project-name" name="name" type="hidden">
          <input id="task-template" name="task_template_path" type="hidden">

          <label class="field dataset-field">
            <span>Dataset</span>
            <div class="input-action-row">
              <input id="dataset-path" name="dataset_path" type="text" list="dataset-options" spellcheck="false" placeholder="/path/to/dataset" required>
              <datalist id="dataset-options"></datalist>
              <button id="browse-datasets-button" class="icon-button field-action" type="button" title="Choose dataset" aria-label="Choose dataset">
                <span class="icon-fallback" aria-hidden="true">…</span>
                <i data-lucide="folder-open" aria-hidden="true"></i>
              </button>
            </div>
          </label>

          <label class="field task-field">
            <span>Goal</span>
            <textarea id="task-body" name="task_body" spellcheck="true" placeholder="Describe the task and evaluation goal" required></textarea>
          </label>

          <details class="advanced-panel">
            <summary>
              <span>Advanced</span>
              <i data-lucide="chevron-down" aria-hidden="true"></i>
            </summary>
            <div class="advanced-fields">
              <label class="field">
                <span>Agent steps</span>
                <input id="agent-steps" type="number" min="1" max="1000" step="1">
              </label>
              <label class="field">
                <span>Node timeout (s)</span>
                <input id="exec-timeout" type="number" min="1" max="86400" step="1">
              </label>
              <label class="field">
                <span>Workers</span>
                <input id="parallel-workers" type="number" min="1" max="64" step="1">
              </label>
              <label class="field">
                <span>Time limit (s)</span>
                <input id="total-time-limit" type="number" min="1" max="2592000" step="1">
              </label>
              <label class="toggle-field span-two">
                <input id="final-retrain" type="checkbox">
                <span class="toggle-control" aria-hidden="true"></span>
                <span>Final retrain</span>
              </label>
            </div>
          </details>
        </form>

        <div class="run-bar">
          <button id="run-button" class="button primary run-button" type="button">
            <i data-lucide="play" aria-hidden="true"></i>
            Start run
          </button>
        </div>
      </section>

      <section class="detail-pane no-run" aria-label="Run details">
        <div id="run-summary" class="run-summary" hidden>
          <div class="run-title">
            <strong id="selected-run-name"></strong>
            <select id="run-history-select" class="run-history-select" aria-label="Run history" hidden></select>
          </div>
          <div id="selected-run-actions" class="run-actions"></div>
        </div>
        <div class="tab-bar" role="tablist" aria-label="Run views">
          <button id="events-tab" class="tab active" type="button" role="tab" data-tab="events" aria-selected="true" aria-controls="events-panel" tabindex="0">
            <i data-lucide="activity" aria-hidden="true"></i>
            Activity
          </button>
          <button id="tree-tab" class="tab" type="button" role="tab" data-tab="tree" aria-selected="false" aria-controls="tree-panel" tabindex="-1">
            <i data-lucide="git-branch" aria-hidden="true"></i>
            Search
          </button>
          <button id="console-tab" class="tab" type="button" role="tab" data-tab="console" aria-selected="false" aria-controls="console-panel" tabindex="-1">
            <i data-lucide="terminal" aria-hidden="true"></i>
            Console
          </button>
          <button id="artifacts-tab" class="tab" type="button" role="tab" data-tab="artifacts" aria-selected="false" aria-controls="artifacts-panel" tabindex="-1">
            <i data-lucide="files" aria-hidden="true"></i>
            Files
          </button>
        </div>

        <div class="tab-content">
          <section id="tree-panel" class="tab-panel" role="tabpanel" aria-labelledby="tree-tab">
            <div class="panel-toolbar">
              <label class="check-label">
                <input id="tree-auto-refresh" type="checkbox" checked>
                <span>Auto-refresh</span>
              </label>
              <div class="panel-toolbar-actions">
                <a id="tree-open-link" class="icon-button small" href="#" target="_blank" rel="noopener" title="Open search" aria-label="Open search" hidden>
                  <span class="icon-fallback" aria-hidden="true">↗</span>
                  <i data-lucide="external-link" aria-hidden="true"></i>
                </a>
                <button id="tree-refresh-button" class="icon-button small" type="button" title="Refresh search" aria-label="Refresh search">
                  <span class="icon-fallback" aria-hidden="true">↻</span>
                  <i data-lucide="refresh-cw" aria-hidden="true"></i>
                </button>
              </div>
            </div>
            <div id="tree-empty" class="empty-state rich-empty-state">
              <div class="empty-icon"><i data-lucide="git-branch" aria-hidden="true"></i></div>
              <strong>No search data yet</strong>
            </div>
            <iframe id="tree-frame" title="Search tree" sandbox="allow-scripts allow-downloads" hidden></iframe>
          </section>

          <section id="console-panel" class="tab-panel" role="tabpanel" aria-labelledby="console-tab">
            <div class="panel-toolbar">
              <label class="check-label">
                <input id="console-follow" type="checkbox" checked>
                <span>Follow output</span>
              </label>
              <button id="console-refresh-button" class="icon-button small" type="button" title="Refresh console" aria-label="Refresh console">
                <span class="icon-fallback" aria-hidden="true">↻</span>
                <i data-lucide="refresh-cw" aria-hidden="true"></i>
              </button>
            </div>
            <pre id="console-output" class="console-output">No output yet.</pre>
          </section>

          <section id="events-panel" class="tab-panel active" role="tabpanel" aria-labelledby="events-tab">
            <div id="events-list" class="events-list">
              <div class="empty-state rich-empty-state"><div class="empty-icon"><i data-lucide="activity" aria-hidden="true"></i></div><strong>No activity yet</strong></div>
            </div>
          </section>

          <section id="artifacts-panel" class="tab-panel" role="tabpanel" aria-labelledby="artifacts-tab">
            <div id="run-observation" class="observation-strip"></div>
            <div id="artifact-list" class="artifact-list">
              <div class="empty-state rich-empty-state"><div class="empty-icon"><i data-lucide="files" aria-hidden="true"></i></div><strong>No files yet</strong></div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <dialog id="settings-dialog" class="modal">
      <form method="dialog" class="modal-shell" id="settings-form">
        <div class="modal-heading">
          <h2>Settings</h2>
          <button class="icon-button" value="cancel" type="submit" title="Close" aria-label="Close">
            <span class="icon-fallback" aria-hidden="true">×</span>
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </div>
        <div class="settings-fields">
          <div class="field">
            <label for="settings-base-url">Base URL</label>
            <input id="settings-base-url" type="url" inputmode="url" autocomplete="off" placeholder="https://api.example.com/v1">
          </div>

          <div class="field">
            <label for="settings-api-key">API key</label>
            <span class="secret-input-row">
              <input id="settings-api-key" type="password" autocomplete="new-password">
              <button class="icon-button secret-toggle" type="button" data-env-key="OPENAI_API_KEY" data-target="settings-api-key" title="Show API key" aria-label="Show API key">
                <span class="icon-fallback" aria-hidden="true">Show</span>
                <i data-lucide="eye" aria-hidden="true"></i>
              </button>
            </span>
            <small id="settings-api-key-status" class="field-status"></small>
          </div>

          <div class="field">
            <label for="settings-model">Model</label>
            <span class="model-input-row">
              <input id="settings-model" type="text" list="settings-model-options" autocomplete="off" aria-describedby="settings-model-status" placeholder="Search or enter model">
              <datalist id="settings-model-options"></datalist>
              <button id="refresh-models-button" class="icon-button" type="button" title="Refresh models" aria-label="Refresh models">
                <span class="icon-fallback" aria-hidden="true">↻</span>
                <i data-lucide="refresh-cw" aria-hidden="true"></i>
              </button>
            </span>
            <small id="settings-model-status" class="field-status"></small>
          </div>

          <details class="settings-more">
            <summary>Search</summary>
            <div class="settings-more-fields">
              <div class="field">
                <label for="settings-serper-key">Serper key</label>
                <span class="secret-input-row">
                  <input id="settings-serper-key" type="password" autocomplete="new-password">
                  <button class="icon-button secret-toggle" type="button" data-env-key="SERPER_API_KEY" data-target="settings-serper-key" title="Show Serper key" aria-label="Show Serper key">
                    <span class="icon-fallback" aria-hidden="true">Show</span>
                    <i data-lucide="eye" aria-hidden="true"></i>
                  </button>
                </span>
                <small id="settings-serper-key-status" class="field-status"></small>
              </div>
              <div class="field">
                <label for="settings-jina-key">Jina key</label>
                <span class="secret-input-row">
                  <input id="settings-jina-key" type="password" autocomplete="new-password">
                  <button class="icon-button secret-toggle" type="button" data-env-key="JINA_API_KEY" data-target="settings-jina-key" title="Show Jina key" aria-label="Show Jina key">
                    <span class="icon-fallback" aria-hidden="true">Show</span>
                    <i data-lucide="eye" aria-hidden="true"></i>
                  </button>
                </span>
                <small id="settings-jina-key-status" class="field-status"></small>
              </div>
            </div>
          </details>
        </div>
        <div class="modal-actions">
          <button class="button secondary" value="cancel" type="submit">Cancel</button>
          <button id="save-env-button" class="button primary" value="default" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <div id="toast-region" class="toast-region" aria-live="polite"></div>
  </body>
</html>
