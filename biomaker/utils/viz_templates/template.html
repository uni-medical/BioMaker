<!doctype html>
<html lang="en"> 
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      id="p5scripttag"
      src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"
      integrity="sha512-uaz5GpnQoE6t5echKlX8P52czvsIGgLPcvlzfvRubLZ1Hp8JemUDnbUiAahbVtPb+jUVrNETuXvAhDDF/N3M4w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>

    <script>
      <!-- placeholder -->
    </script>
    <title>BioMaker Run Visualization</title>
    <style>
      body,
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #f2f0e7;
        color: #f2f0e7;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        overflow: hidden;
      }
      canvas {
        float: left;
        height: 100vh;
        width: 58vw;
      }
      #side-panel {
        float: right;
        height: 100vh;
        width: 42vw;
        background-color: #282c34;
        overflow: auto;
        padding: 18px 20px 28px;
      }
      #run-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
        border-bottom: 1px solid #3a404b;
        color: #c7ccd8;
        font-size: 13px;
        padding-bottom: 12px;
        margin-bottom: 14px;
      }
      #run-summary b {
        color: #f0d36c;
      }
      #selected-label {
        color: #ffffff;
        font-size: 20px;
        font-weight: 650;
        line-height: 1.25;
        margin-bottom: 12px;
      }
      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 14px;
      }
      .metric {
        border: 1px solid #3a404b;
        border-radius: 6px;
        padding: 8px;
        min-width: 0;
      }
      .metric span {
        display: block;
        color: #9da6b8;
        font-size: 11px;
        margin-bottom: 4px;
      }
      .metric strong {
        color: #f6f7fb;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      h3 {
        color: #d5d9e3;
        font-size: 13px;
        margin: 14px 0 6px;
      }
      p,
      pre {
        color: #f2f0e7;
        font-family: inherit;
        font-size: 13px;
        line-height: 1.45;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      pre {
        background-color: #20242c;
        border: 1px solid #3a404b;
        border-radius: 6px;
        padding: 10px;
        overflow: auto;
      }
      details {
        border-top: 1px solid #3a404b;
        margin-top: 14px;
        padding-top: 12px;
      }
      summary {
        cursor: pointer;
        color: #d5d9e3;
        font-size: 13px;
        font-weight: 650;
        margin-bottom: 10px;
      }
      .prompt-metrics {
        margin-top: 2px;
      }
      .prompt-section {
        border-top: 0;
        margin-top: 8px;
        padding-top: 0;
      }
      .detail-record {
        margin-left: 10px;
      }
      .detail-record-body {
        border-left: 2px solid #3a404b;
        margin: 8px 0 0 14px;
        padding-left: 12px;
      }
      .detail-record-body .prompt-section {
        background-color: #252a33;
        border: 1px solid #343b46;
        border-radius: 6px;
        margin-top: 8px;
        padding: 8px;
      }
      .detail-record-body .prompt-section summary {
        margin-bottom: 8px;
      }
      .prompt-section summary {
        align-items: baseline;
        display: flex;
        gap: 8px;
        justify-content: space-between;
      }
      .prompt-section summary span,
      .muted {
        color: #9da6b8;
        font-size: 12px;
        font-weight: 500;
      }
      code {
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre;
      }
      .code-with-lines {
        padding: 0;
      }
      .code-with-lines code {
        display: block;
        line-height: 1.35;
        white-space: normal;
      }
      .code-line {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        line-height: inherit;
        min-width: max-content;
      }
      .line-number {
        background-color: #1a1d24;
        border-right: 1px solid #3a404b;
        color: #7f8797;
        padding: 0 8px 0 6px;
        text-align: right;
        user-select: none;
        white-space: nowrap;
        width: 5.5ch;
      }
      .line-content {
        padding-left: 10px;
        line-height: inherit;
        white-space: pre;
      }
      .best-pill {
        display: inline-block;
        color: #201b09;
        background: #d6a11e;
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 12px;
        font-weight: 650;
      }
      @media (max-width: 900px) {
        canvas,
        #side-panel {
          float: none;
          width: 100vw;
        }
        canvas {
          height: 48vh;
        }
        #side-panel {
          height: 52vh;
        }
        .metrics-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <aside id="side-panel">
      <div id="run-summary"></div>
      <div id="selected-label">Search start</div>
      <section id="node-summary"></section>
      <details>
        <summary>Input Prompt</summary>
        <div id="input-prompt"></div>
      </details>
      <details>
        <summary>Plan</summary>
        <pre id="plan"></pre>
      </details>
      <details>
        <summary>Code</summary>
        <div id="code"></div>
      </details>
      <details>
        <summary>Execution Output</summary>
        <pre id="output"></pre>
      </details>
    </aside>
  </body>
</html>
