# path to the task data directory
data_dir: null

# either provide a path to a plaintext file describing the task
desc_file: null
# or provide the task goal (and optionally evaluation information) as arguments
goal: null
eval: null

log_dir: logs
workspace_dir: workspaces

# whether to unzip any archives in the data directory
preprocess_data: False
# whether to copy the data to the workspace directory (otherwise it will be symlinked)
# by default BioMaker creates a shallow symlinked input workspace so large datasets are not copied
copy_data: False
# Shared deterministic run resources. Null defaults to <workspace_dir>/_shared.
resource_dir: null

exp_name: null # a random experiment name will be generated if not provided

model_for_all_agents: null # optional CLI override for all model roles

# Reuse smoke-tested frozen evaluators when the task/split/evaluator prompt is unchanged.
evaluator_cache:
  enabled: True

# Agentic split builder retry budget. Each failed package is verified and the
# verifier errors are fed back to the builder before retrying.
split_builder:
  attempts: 5
  source: agentic
  package_dir: null

# After the search selects the best node, rerun that code once with the hidden
# score-validation labels merged into the training table. This is a final-only
# retrain and does not affect node selection.
final_retrain:
  enabled: True

# Private test is evaluated once after validation-only model selection and,
# when enabled, successful final retraining. It never feeds back into search.
private_evaluation:
  protocol: post_selection_once

# A selected model must ship reloadable artifacts and their manifest.
model_artifacts:
  required: True

# Total transport attempts, including the first request.
provider:
  request_timeout_seconds: 600.0
  max_attempts: 2
  max_elapsed_seconds: 1250.0

# agent hyperparams
agent:
  code_generation_attempts: 1
  # how many proposal/debug/improve iterations to run
  steps: 35
  # Hard safety limit for the whole run in seconds. Step count and this limit both apply; whichever is reached first stops the run.
  total_time_limit: 86400
  # whether to instruct the agent to generate a prediction function
  expose_prediction: True
  # whether to provide the agent with the unified data/evaluator summary
  data_summary: True
  enable_monai_knowledge_base: True
  enable_query2doc: False
  enable_web_search: True
  web_search_topk: 2
  enable_node_tools: True
  max_node_tool_calls: 4

  # hyperparameters for the tree search
  search:
    max_children_per_node: 5
    max_debug_depth: 2
    topk_improve: 3

  # LLM settings for coding. Override per run with model_for_all_agents if needed.
  code:
    model: deepseek-v4-flash
    temp: 0.7

  # LLM settings for knowledge base / simple helper work.
  knowledge_base:
    model: deepseek-v4-flash
    temp: 0.0
    # Retrieval backend for the local MONAI documentation index: embedding or keyword.
    required: False
    retrieval_mode: ${oc.env:BIOMAKER_RAG_MODE,keyword}
    embedding_model: ${oc.env:BIOMAKER_EMBEDDING_MODEL,text-embedding-3-large}
    topk: ${oc.decode:${oc.env:BIOMAKER_RAG_TOPK,5}}

  # LLM settings for evaluating program output / tracebacks.
  feedback:
    model: deepseek-v4-flash
    temp: 0.0

# settings for code execution
exec:
  # Hard safety timeout for one generated node in seconds. This is a longest tolerated runtime, not a target budget.
  timeout: 600
  # Trusted evaluator invocation budget in seconds (preparation, validation,
  # candidate and private scoring). Independent of generated-code execution.
  evaluator_timeout: 3600
  # Maximum case-level scoring threads per evaluator. Keep bounded when
  # multiple candidates/tasks share CPU and memory; 1 preserves serial scoring.
  evaluator_workers: 1
  # Candidate concurrency. Auto assigns one candidate slot per visible CUDA GPU,
  # or one slot on Apple MPS / CPU. A positive integer remains a CLI override.
  parallel_workers: auto
  # Runtime-resolved facts populated by BioMaker; do not set these manually.
  requested_parallel_workers: null
  effective_parallel_workers: null
  compute_slots: null
  agent_file_name: runfile.py
  format_tb_ipython: False
  enforce_environment: True
  include_medical_packages: True

# LLM settings for final report from journal
generate_report: True
report:
  model: deepseek-v4-flash
  temp: 1.0
  
log_level: INFO
