# path to the task data directory
data_dir: null

# either provide a path to a plaintext file describing the task
desc_file: null
# or provide the task goal (and optionally evaluation information) as arguments
goal: null
eval: null

log_dir: logs
workspace_dir: workspaces

# whether to unzip any archives in the data directory
preprocess_data: True
# whether to copy the data to the workspace directory (otherwise it will be symlinked)
# copying is recommended to prevent the agent from accidentally modifying the original data
copy_data: True

exp_name: null # a random experiment name will be generated if not provided

model_for_all_agents: null # optional CLI override for all model roles

# agent hyperparams
agent:
  # how many proposal/debug/improve iterations to run
  steps: 15
  # Hard safety limit for the whole run in seconds. This is a longest tolerated runtime, not a target budget.
  total_time_limit: 14400
  # whether to instruct the agent to use CV (set to 1 to disable)
  k_fold_validation: 1
  # whether to instruct the agent to generate a prediction function
  expose_prediction: True
  # whether to provide the agent with a preview of the data
  data_preview: True
  enable_monai_knowledge_base: True
  enable_query2doc: False
  enable_web_search: True
  web_search_topk: 2
  enable_node_tools: True
  # Kept for config compatibility; node tools currently run one request round.
  max_node_tool_rounds: 6
  max_node_tool_calls: 20

  # hyperparameters for the tree search
  search:
    max_children_per_node: 5
    num_bugs: 1
    max_debug_depth: 2
    topk_improve: 3

  # LLM settings for coding. Null means read BIOMAKER_MAIN_MODEL / OPENAI_MODEL from .env.
  code:
    model: null
    temp: 0.7

  # LLM settings for knowledge base / simple helper work. Null means read BIOMAKER_HELPER_MODEL from .env.
  knowledge_base:
    model: null
    temp: 0.0

  # LLM settings for evaluating program output / tracebacks. Null means read BIOMAKER_MAIN_MODEL from .env.
  feedback:
    model: null
    temp: 0.0

# settings for code execution
exec:
  # Hard safety timeout for one generated node in seconds. This is a longest tolerated runtime, not a target budget.
  timeout: 600
  agent_file_name: runfile.py
  format_tb_ipython: False
  enforce_environment: True
  include_medical_packages: True

# LLM settings for final report from journal
generate_report: True
report:
  model: null
  temp: 1.0
  
log_level: INFO
